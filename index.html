<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帝王与国相 · 序章</title>
<style>
  :root{
    --paper:#F2EADB;
    --paper-2:#E9DFCB;
    --ink:#211E1A;
    --ink-2:#4B4237;
    --ink-3:#7C7264;
    --red:#9E3B2F;
    --amber:#B8873A;
    --gold:#B8934E;
    --line:#D8CCB6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#0d0c0b;overflow:hidden;}
  body{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,"STSong",serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #viewport{position:fixed;inset:0;display:grid;place-items:center;}
  #stage{
    position:relative;width:1280px;height:720px;
    transform-origin:center center;
    background:var(--paper);
    overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,.6);
    user-select:none;
  }

  /* ---------- 纸纹底 ---------- */
  .paper{
    position:absolute;inset:0;
    background:
      radial-gradient(120% 90% at 20% 0%, #F7F1E4 0%, rgba(247,241,228,0) 55%),
      radial-gradient(90% 80% at 90% 100%, #EFE4CE 0%, rgba(239,228,206,0) 60%),
      linear-gradient(160deg,#F4EDDF 0%,#EDE3D1 100%);
  }
  .paper::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(120,100,70,.035) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,100,70,.025) 0 1px, transparent 1px 4px);
    mix-blend-mode:multiply;
  }
  .vignette{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(75% 70% at 50% 45%, rgba(0,0,0,0) 55%, rgba(90,70,40,.16) 100%);
  }

  /* ---------- 背景层 ---------- */
  #bgLayer{position:absolute;inset:0;overflow:hidden;}
  /* 场景底：墨线舞台 */
  #sceneBg{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s ease;}
  #sceneBg.on{opacity:1;}
  #sceneBg svg{width:100%;height:100%;display:block;}
  #stage.bgMap  #sceneBg{opacity:.38;}
  #stage.bgArea #sceneBg{opacity:1;}
  #stage.bgArea #sceneBg svg,
  #stage.bgMap  #sceneBg svg{filter:saturate(.9);}
  #bgLayer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease;}
  #bgLayer img.on{opacity:1;}
  #bgLayer .cgVeil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,6,.15) 0%,rgba(10,8,6,.55) 100%);opacity:0;transition:opacity .8s;}
  #bgLayer .cgVeil.on{opacity:1;}
  /* CG 时压文字的暗底：独立一层，边缘柔和 */
  #cgShade{
    position:absolute;left:0;right:0;bottom:0;height:390px;
    background:linear-gradient(0deg,rgba(14,10,7,.94) 0%,rgba(14,10,7,.86) 22%,rgba(14,10,7,.52) 52%,rgba(14,10,7,.18) 78%,rgba(14,10,7,0) 100%);
    opacity:0;transition:opacity .5s;pointer-events:none;
  }
  #stage.cgOn #cgShade{opacity:1;}

  /* ---------- 立绘 ---------- */
  #sprite{
    position:absolute;right:52px;bottom:0;height:604px;
    opacity:0;transform:translateY(14px);
    transition:opacity .55s ease, transform .55s ease;
    filter:drop-shadow(0 18px 34px rgba(60,45,25,.28));
    pointer-events:none;
  }
  #sprite.on{opacity:1;transform:translateY(0);}
  #sprite img{height:100%;display:block;}

  /* ---------- 顶部信息条 ---------- */
  #hud{
    position:absolute;left:0;right:0;top:0;height:54px;z-index:30;
    display:flex;align-items:center;gap:18px;padding:0 28px;
    font-size:14px;color:var(--ink-2);
    background:linear-gradient(180deg,rgba(242,234,219,.96),rgba(242,234,219,.72) 70%,rgba(242,234,219,0));
    opacity:0;transition:opacity .35s;pointer-events:none;
  }
  #hud.on{opacity:1;pointer-events:auto;}
  #hud .date{letter-spacing:.06em;}
  #hud .date b{color:var(--red);font-weight:600;}
  #hud .slot{display:flex;gap:6px;align-items:center;}
  #hud .dot{width:7px;height:7px;border-radius:50%;background:#C9BCA4;}
  #hud .dot.on{background:var(--red);box-shadow:0 0 0 3px rgba(158,59,47,.16);}
  #hud .spacer{flex:1;}
  .btn{
    font-family:inherit;font-size:13.5px;color:var(--ink-2);
    background:rgba(255,255,255,.6);border:1px solid var(--line);
    padding:6px 15px;border-radius:3px;cursor:pointer;letter-spacing:.06em;
    transition:.18s;
  }
  .btn:hover{background:#fff;border-color:var(--gold);color:var(--ink);}
  .btn.primary{background:var(--red);border-color:var(--red);color:#F7F1E6;}
  .btn.primary:hover{background:#8C3327;border-color:#8C3327;color:#fff;}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn.lock{opacity:.42;cursor:not-allowed;}
  .btn.lock:hover{background:rgba(255,255,255,.6);border-color:var(--line);color:var(--ink-2);}

  /* ---------- 文字区 ---------- */
  /* CG 出现时：文字区上一层暗底，改浅字 */
  #stage.cgOn #textWrap{padding-bottom:104px;}
  #stage.cgOn #text{color:#F4EBDA;text-shadow:0 1px 5px rgba(0,0,0,.55);}
  #stage.cgOn #who{color:#EDC583;border-bottom-color:rgba(237,197,131,.42);}
  #stage.cgOn #hint{color:#DED2BC;text-shadow:0 1px 6px rgba(0,0,0,.8);}
  #stage.cgOn #btnTalkSkip{background:rgba(20,15,10,.62);color:#DED2BC;border-color:rgba(237,197,131,.28);}
  #stage.cgOn .choice{
    background:rgba(22,17,12,.80);color:#F4EBDA;
    border-color:rgba(237,197,131,.26);border-left-color:#C0453A;
  }
  #stage.cgOn .choice:hover{background:rgba(34,26,18,.9);}
  #stage.cgOn #choices .prompt{
    color:#E8DCC6;background:rgba(14,10,7,.66);padding:7px 14px;border-radius:2px;
    text-shadow:0 1px 4px rgba(0,0,0,.6);align-self:flex-start;
  }
  #stage.spriteOn #textWrap{padding-right:540px;}
  #stage.spriteOn .choice{max-width:600px;}
  #stage.spriteOn #choices .prompt{max-width:600px;}
  #textWrap{
    position:absolute;left:0;right:0;bottom:0;padding:0 84px 96px;
    opacity:0;transition:opacity .35s;
  }
  #textWrap.on{opacity:1;}
  #who{
    display:inline-block;font-size:19px;letter-spacing:.22em;color:var(--red);
    margin-bottom:12px;font-weight:600;
    padding-bottom:5px;border-bottom:1px solid rgba(158,59,47,.35);
  }
  #who.hide{display:none;}
  #text{
    font-size:22px;line-height:1.95;letter-spacing:.035em;color:var(--ink);
    max-width:720px;text-shadow:0 1px 0 rgba(255,255,255,.55);
  }
  #text.paras p{margin:0 0 14px;}
  #text.paras p:last-child{margin-bottom:0;}
  #text .cursor{
    display:inline-block;width:9px;height:20px;margin-left:4px;
    background:var(--red);opacity:.65;vertical-align:-2px;animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  #hint{
    position:absolute;right:88px;bottom:22px;font-size:12.5px;color:var(--ink-2);
    letter-spacing:.16em;opacity:0;transition:opacity .3s;
    text-shadow:0 0 6px rgba(242,234,219,.95),0 0 12px rgba(242,234,219,.85),0 0 20px rgba(242,234,219,.7);
  }
  #hint.on{opacity:.85;animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}

  /* ---------- 选项 ---------- */
  #choices{
    position:absolute;left:0;right:0;bottom:0;padding:0 84px 60px;
    display:flex;flex-direction:column;gap:12px;align-items:flex-start;
    opacity:0;pointer-events:none;transition:opacity .4s;
  }
  #choices.on{opacity:1;pointer-events:auto;}
  .choice{
    font-family:inherit;font-size:19px;color:var(--ink);
    background:rgba(255,255,255,.82);
    border:1px solid rgba(158,59,47,.28);
    border-left:3px solid var(--red);
    padding:14px 26px;border-radius:2px;cursor:pointer;
    letter-spacing:.04em;transition:.16s;min-width:420px;text-align:left;
  }
  .choice:hover{background:#fff;border-left-width:6px;padding-left:30px;color:var(--red);}
  .choice .tag{font-size:12px;color:var(--ink-3);margin-left:10px;letter-spacing:.1em;}
  #choices .prompt{font-size:16.5px;color:var(--ink-3);letter-spacing:.08em;margin-bottom:2px;padding-left:2px;}

  /* ---------- 地图 ---------- */
  #map{
    position:absolute;inset:0;padding:78px 70px 54px;
    display:flex;flex-direction:column;
    opacity:0;pointer-events:none;transition:opacity .4s;
  }
  #map.on{opacity:1;pointer-events:auto;}
  .mapHead{display:flex;align-items:baseline;gap:16px;margin-bottom:20px;}
  .mapHead h2{font-size:26px;letter-spacing:.2em;font-weight:600;white-space:nowrap;}
  .mapHead .sub{font-size:13px;color:var(--ink-3);letter-spacing:.1em;}
  .areas{display:grid;grid-template-columns:1fr 1fr;gap:26px;flex:1;align-content:center;}
  .area{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:3px;padding:18px 20px 20px;}
  .area h3{font-size:15px;letter-spacing:.24em;color:var(--red);font-weight:600;margin-bottom:14px;}
  .spots{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .spot{
    font-family:inherit;text-align:left;cursor:pointer;
    background:rgba(255,255,255,.72);border:1px solid var(--line);
    border-radius:3px;padding:12px 14px;transition:.16s;
  }
  .spot:hover{background:#fff;border-color:var(--gold);transform:translateY(-1px);}
  .spot .n{font-size:16.5px;letter-spacing:.1em;color:var(--ink);}
  .spot .a{font-size:12.5px;color:var(--ink-3);margin-top:5px;letter-spacing:.06em;}
  .spot .e{font-size:12px;color:var(--red);margin-top:7px;letter-spacing:.04em;}
  .spot.off{opacity:.42;cursor:not-allowed;background:rgba(240,235,225,.6);}
  .spot.off:hover{transform:none;border-color:var(--line);background:rgba(240,235,225,.6);}
  .spot.off .e{color:var(--ink-3);}
  .mapFoot{
    display:flex;gap:38px;align-items:baseline;
    margin-top:auto;padding-top:16px;border-top:1px solid var(--line);
    font-size:13px;color:var(--ink-3);letter-spacing:.08em;
  }
  .mapFoot b{color:var(--ink);font-family:Georgia,serif;font-size:17px;margin-left:7px;letter-spacing:0;}
  .mapFoot .hi b{color:var(--red);}
  /* 地图上的区域卡：点进去才是具体行动 */
  .spot .go{font-size:12px;color:var(--ink-3);margin-top:7px;letter-spacing:.14em;}
  .spot .dotEv, .spot .dotSrc{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--red);margin-right:7px;vertical-align:1px;
    box-shadow:0 0 0 3px rgba(158,59,47,.14);
  }
  .spot .dotSrc{background:var(--amber);box-shadow:0 0 0 3px rgba(184,135,58,.16);}
  .spot .go.ev{color:var(--amber);}
  .spot .go.src{color:var(--red);}

  /* ---------- 区域页 ---------- */
  #areaPage{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg,rgba(242,234,219,.98) 0%,rgba(242,234,219,.94) 10%,rgba(242,234,219,.60) 19%,rgba(242,234,219,.12) 27%,rgba(242,234,219,.06) 100%),
      linear-gradient(0deg,rgba(242,234,219,.94) 0%,rgba(242,234,219,.58) 6%,rgba(242,234,219,0) 13%);
    padding:0 70px 36px;
    display:flex;flex-direction:column;
    opacity:0;pointer-events:none;transition:opacity .35s;z-index:18;overflow:auto;
  }
  #areaPage.on{opacity:1;pointer-events:auto;}
  .aHead{display:flex;align-items:baseline;gap:14px;padding:58px 0 8px;}
  .aHead h2{font-size:28px;letter-spacing:.22em;font-weight:600;}
  .aHead .sub{font-size:12.5px;color:var(--ink-3);letter-spacing:.12em;}
  .aHead .spacer{flex:1;}
  .aLine{font-size:13.5px;color:var(--ink-3);letter-spacing:.06em;line-height:1.9;
    padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:24px;max-width:820px;}
  .aOpts{display:flex;flex-direction:column;gap:12px;max-width:820px;}
  .opt{
    display:flex;align-items:center;gap:18px;font-family:inherit;text-align:left;
    background:rgba(253,249,240,.62);backdrop-filter:blur(1.5px);border:1px solid rgba(150,128,96,.30);border-left:3px solid var(--gold);
    border-radius:3px;padding:15px 20px;cursor:pointer;transition:.16s;
  }
  .opt:hover{background:#fff;border-left-color:var(--red);transform:translateX(3px);}
  .opt .l{flex:1;min-width:0;}
  .opt .n{font-size:18px;letter-spacing:.1em;color:var(--ink);}
  .opt .n .flag{
    display:inline-block;font-size:10px;line-height:1.3;letter-spacing:.06em;color:#F7F1E6;
    background:var(--red);border-radius:2px;padding:2px 6px 3px;margin-right:9px;vertical-align:2px;
    font-weight:400;
  }
  .opt .d{font-size:12.5px;color:var(--ink-3);margin-top:6px;letter-spacing:.05em;line-height:1.7;}
  .opt .r{font-size:13px;color:var(--red);letter-spacing:.06em;white-space:nowrap;}
  .opt .r .g{color:var(--ink-3);font-size:11.5px;display:block;margin-top:4px;letter-spacing:.04em;}
  /* 区域事件＝黄 */
  .opt.ev{background:rgba(184,135,58,.07);border-left-color:var(--amber);}
  .opt.ev .n{color:#8E6520;}
  .opt.ev .flag{background:var(--amber);}
  /* 支线＝红 */
  .opt.ev-story{background:rgba(158,59,47,.055);border-left-color:var(--red);}
  .opt.ev-story .n{color:var(--red);}
  .opt.ev-story .flag{background:var(--red);}
  .opt.off{opacity:.45;cursor:not-allowed;background:rgba(240,235,225,.55);border-left-color:#CFC3AC;}
  .opt.off:hover{transform:none;border-left-color:#CFC3AC;background:rgba(240,235,225,.55);}
  .opt.off .r{color:var(--ink-3);}
  .aFoot{
    margin-top:auto;padding-top:18px;border-top:1px solid var(--line);
    display:flex;gap:32px;align-items:baseline;font-size:12.5px;color:var(--ink-3);letter-spacing:.08em;
  }
  .aFoot b{color:var(--ink);font-family:Georgia,serif;font-size:16px;margin-left:6px;}

  /* ---------- 面板 ---------- */
  .panel{
    position:absolute;inset:0;background:#F2EADB;
    padding:0 72px 40px;opacity:0;pointer-events:none;transition:opacity .35s;
    overflow:auto;z-index:20;
  }
  .panel.on{opacity:1;pointer-events:auto;}
  .panel h2{font-size:24px;letter-spacing:.24em;font-weight:600;}
  .panel h2 small{font-size:12.5px;color:var(--ink-3);letter-spacing:.1em;margin-left:14px;font-weight:400;}
  .pBar{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:58px 0 16px;}
  .pBar .spacer{flex:1;}
  .btn.back{
    padding:5px 16px 5px 12px;font-size:13px;letter-spacing:.1em;
    background:rgba(255,255,255,.7);
  }
  .btn.back::before{content:"←";margin-right:8px;color:var(--ink-3);}
  .btn.back:hover::before{color:var(--red);}
  .cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:34px;}
  .col h3{font-size:13px;letter-spacing:.24em;color:var(--red);margin-bottom:16px;}
  .stat{margin-bottom:16px;}
  .stat .row{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:6px;color:var(--ink-2);}
  .stat .row b{font-family:Georgia,serif;color:var(--ink);font-size:15px;}
  .stat .row em{font-style:normal;font-size:11.5px;color:var(--red);margin-left:7px;letter-spacing:.04em;}
  .stat .row .cap{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;}
  .stat .row .stg{font-size:11.5px;color:var(--ink-3);letter-spacing:.1em;margin-left:9px;}
  .bar{height:6px;background:rgba(120,100,70,.16);border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#C4694F);border-radius:3px;transition:width .5s;}
  .bar.gold i{background:linear-gradient(90deg,var(--gold),#D4B878);}
  .note{font-size:12.5px;color:var(--ink-3);line-height:1.9;margin-top:10px;letter-spacing:.04em;}
  .hidden-val{font-size:14.5px;color:var(--ink-3);letter-spacing:.12em;}

  /* 人物面板 */
  .chars{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:stretch;}
  .charCard{
    background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:3px;
    padding:16px 18px 18px;display:flex;flex-direction:column;text-align:center;
  }
  .charCard .pic{height:186px;display:grid;place-items:end center;margin-bottom:10px;}
  .charCard .pic img{max-height:180px;max-width:100%;filter:drop-shadow(0 10px 20px rgba(60,45,25,.22));}
  .charCard .nm{font-size:19px;letter-spacing:.2em;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;}
  .charCard .nm .st{
    font-size:11px;letter-spacing:.14em;color:var(--red);
    border:1px solid rgba(158,59,47,.4);border-radius:2px;padding:2px 7px;
  }
  .charCard .ti{font-size:12px;color:var(--ink-3);letter-spacing:.1em;margin-top:6px;}
  .charCard .cstats{margin-top:14px;text-align:left;}
  .charCard .stat.mini{margin-bottom:11px;}
  .charCard .stat.mini .row{font-size:13px;margin-bottom:5px;}
  .charCard .stat.mini .row b{font-size:14px;}
  .charCard .note{margin-top:auto;padding-top:12px;font-size:12px;line-height:1.85;text-align:left;}
  .charCard .cmeta{font-size:11.5px;color:var(--ink-3);letter-spacing:.06em;margin-top:8px;text-align:left;}
  .charCard .cmeta b{color:var(--red);font-family:Georgia,serif;font-size:13px;margin:0 2px;}
  .mini4{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-bottom:4px;}
  .mini4 .m{background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:2px;padding:7px 10px;text-align:left;}
  .mini4 .m span{font-size:12px;color:var(--ink-3);letter-spacing:.1em;}
  .mini4 .m b{display:block;font-family:Georgia,serif;font-size:17px;color:var(--ink);margin-top:1px;}
  .secret{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12.5px;color:var(--ink-3);letter-spacing:.1em;
    border-top:1px dashed var(--line);padding-top:9px;margin-top:2px;
  }
  .secret b{font-family:Georgia,serif;font-size:14px;color:var(--ink-3);letter-spacing:.2em;}

  /* 存档 */
  .saves{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-bottom:26px;}
  .saveCard{background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:3px;padding:18px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;}
  .saveCard .t{font-size:13px;color:var(--ink-3);letter-spacing:.12em;}
  .saveCard .d{font-size:15px;color:var(--ink);margin:8px 0;letter-spacing:.04em;}
  .saveCard .r{display:flex;gap:8px;}
  .saveCard .r .btn{padding:5px 12px;font-size:12.5px;}
  .toolRow{display:flex;gap:12px;flex-wrap:wrap;}

  /* 标题画面 */
  #title{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .7s;}
  #title.on{opacity:1;pointer-events:auto;}
  #title img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  #title .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,12,10,.86) 0%,rgba(15,12,10,.5) 42%,rgba(15,12,10,.05) 72%);}
  #title .inner{position:absolute;left:96px;top:150px;color:#F4ECDE;}
  #title .kick{font-size:13px;letter-spacing:.42em;color:var(--gold);margin-bottom:22px;}
  #title h1{font-size:64px;letter-spacing:.14em;line-height:1.25;font-weight:600;}
  #title .rule{width:64px;height:3px;background:var(--red);margin:26px 0 24px;}
  #title .sub{font-size:16px;letter-spacing:.1em;color:#D8CBB4;}
  #title .menu{margin-top:44px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
  #title .menu .btn{background:rgba(20,16,14,.55);border-color:rgba(216,203,180,.35);color:#EFE6D6;padding:11px 34px;font-size:15px;}
  #title .menu .btn:hover{background:var(--red);border-color:var(--red);color:#fff;}
  #title .foot{position:absolute;left:96px;bottom:44px;font-size:12px;color:#9C8F78;letter-spacing:.14em;}

  /* 换章卡 */
  #chapterCard{
    position:absolute;inset:0;z-index:50;background:#F2EADB;
    display:grid;place-items:center;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .8s;
  }
  #chapterCard.on{opacity:1;pointer-events:auto;}

<script>
/* =========================================================

   设计要点：

   2) 混合节奏：日常段落整段铺开（block），

const $ = (s) => document.querySelector(s);

/* 每章开场的两行字 */
const CHAPTER_OPEN = {

/* ================= 场景底：墨线舞台 =================
   不画具体的房间，只画柱、梁、窗、地、光 —— 像一张淡墨的舞台速写。
   墨分三层：前景深、中景中、远景淡；光用暖色叠在上面。 */

const SB = {};

const ink  = o => `rgba(64,48,32,${o})`;
const inkg = o => `rgba(52,60,58,${o})`;

/* 一点透视的地面线 */
function flr(vx, vy, op, n){
  n = n || 7;
  let s = '';
  for(let i = 0; i < n; i++){
    const t = (i + 1) / n;
    const y = vy + (720 - vy) * Math.pow(t, 1.7);
    s += `<line x1="0" y1="${y.toFixed(1)}" x2="1280" y2="${y.toFixed(1)}" stroke="${ink(op)}" stroke-width="${(0.55 + t * 0.95).toFixed(2)}"/>`;
  }
  for(let i = -6; i <= 6; i++){
    const bx = vx + i * 176;
    const t0 = 30 / (720 - vy);
    const x1 = vx + (bx - vx) * t0, y1 = vy + 30;
    s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${bx}" y2="720" stroke="${ink(op * 0.7)}" stroke-width="0.75"/>`;
  }
  return s;
}

/* 垂帘：x 起止、高度、褶数 */
function curtain(x1, x2, top, bot, n, op){
  let s = '';
  for(let i = 0; i <= n; i++){
    const t = i / n;
    const x = x1 + (x2 - x1) * t;
    const bow = Math.sin(t * 9.6) * 5;
    s += `<path d="M${x.toFixed(0)},${top} Q${(x + bow).toFixed(0)},${(top + bot) / 2} ${(x + bow * 1.6).toFixed(0)},${bot}" stroke="${ink(op)}" stroke-width="1.1" fill="none"/>`;
  }
  return s;
}

/* 一串灯笼：两点之间等距 */
function lanterns(x1, y1, x2, y2, n, r, op){
  let s = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ink(op * 0.5)}" stroke-width="1"/>`;
  for(let i = 1; i < n; i++){
    const t = i / n;
    const x = x1 + (x2 - x1) * t;
    const y = y1 + (y2 - y1) * t + Math.sin(t * Math.PI) * 16;
    s += `<line x1="${x.toFixed(0)}" y1="${(y - 3).toFixed(0)}" x2="${x.toFixed(0)}" y2="${(y + r + 2).toFixed(0)}" stroke="${ink(op * 0.4)}" stroke-width=".8"/>`;
    s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r * 3.4}" fill="url(#gLamp)" opacity=".9"/>`;
    s += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${r}" ry="${r * 1.15}" fill="#C4553F" opacity="${(op * 2.2).toFixed(2)}"/>`;
    s += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${r * 0.55}" ry="${r * 0.7}" fill="#F3C878" opacity="${(op * 2.6).toFixed(2)}"/>`;
  }
  return s;
}

function floorBase(y, op){

/* 布帘：一片有垂坠的布 */
function drape(x, w, h, op){
  const b = w * 0.16;
  return `<path d="M${x},0 Q${x-b},${h*0.35} ${x+b*0.6},${h*0.7} Q${x+b*1.4},${h*0.9} ${x+b*0.4},${h}
      L${x+w-b*0.4},${h} Q${x+w-b*1.4},${h*0.9} ${x+w-b*0.6},${h*0.7} Q${x+w+b},${h*0.35} ${x+w},0 Z"
      fill="rgba(96,52,38,${op})"/>`;
}

  final:'hanzhang'
};

let curBgKey = null;
function setSceneBg(key, force){
  if(!key || !SB[key]) return;
  if(curBgKey === key && !force) return;
  curBgKey = key;
  const el = $('#sceneBg');
  el.innerHTML = SB[key]();
  el.classList.add('on');
}

/* ---------------- 运行时 ---------------- */
let scene = null;          // {id, steps, i}
let busy = false;
let typing = null;
let curArea = null;        // 当前所在区域
let curSprite = null;      // 当前立绘（切地图/区域时不丢，回到剧情自动恢复）
let TY_SPEED = 26;         // 打字机速度（?fast=1 时几乎瞬间）

function flag(k){ S.flags[k] = true; }
function has(k){ return !!S.flags[k]; }

/* 数值加成（含每章上限） */
function addVar(k, v){
  if(!(k in S.vars)) return;
  if(v > 0 && k !== '情愫'){
    const left = CHAPTER_CAP - (S.gain[k]||0);
    if(left <= 0){ return false; }
    v = Math.min(v, left);
    S.gain[k] = (S.gain[k]||0) + v;
  }
  S.vars[k] = Math.max(0, Math.min(ATTR_MAX, S.vars[k] + v));
  return true;
}

function addNat(k, v){
  if(!(k in S.nat)) return;
  S.nat[k] = Math.max(0, S.nat[k] + v);
}
function applyEff(eff){
  if(!eff) return;
  for(const k in eff){
    if(k in S.nat) addNat(k, eff[k]);
    else addVar(k, eff[k]);
  }
  refreshHud();
}

/* ---------------- 时间 ---------------- */
function timeStr(){
  const c = CHAPTERS[S.ch] || CHAPTERS[0];
  return `${c.year} · ${c.month}${DAY_NAMES[S.day-1]}日`;
}
function chapterNo(){ const c = CHAPTERS[S.ch] || CHAPTERS[0]; return c.n === '序' ? '序章' : '第' + c.n + '章'; }
function advanceTime(){
  if(S.slot < 2){ S.slot++; }
  else if(S.day < TOTAL_DAYS){ S.day++; S.slot = 0; }
  refreshHud();
}

/* 主线：返回当前时刻应触发的场景 id */
function mainScene(){
  const nodes = MAIN_NODES[S.ch] || [];
  // 一、三重锁：章 + 日 + 时段，到点必播（绝不提前）
  for(const [d, sl, id] of nodes){
    if(S.day === d && S.slot === sl && !has(id)) return id;
  }
  // 二、兜底补播：已经过了那个时辰还没演（读档 / 跳天 / 老存档），补上，不让它漏
  for(const [d, sl, id] of nodes){
    if(has(id)) continue;
    if(S.day > d || (S.day === d && S.slot > sl)) return id;
  }
  return null;
}
/* 条件事件 */


/* ---------------- 渲染：HUD ---------------- */
function refreshHud(){
  $('#hudDate').innerHTML = `${timeStr()} · <b>${SLOTS[S.slot]}</b>`;
  $('#hudSlot').innerHTML = SLOTS.map((s,i)=>
    `<span class="dot ${i===S.slot?'on':''}"></span>`).join('') +
    `<span class="act" style="margin-left:10px;font-size:12.5px;color:#7C7264">行动 1 / 1</span>`;
  syncNav();
}

/* ---------------- 场景引擎 ---------------- */
/* 剧情进行中锁住导航：主线/事件/活动字幕期间不能切地图，防止中途去刷属性 */
function syncNav(){
  const locked = !!scene;
  const b = $('#btnMap');
  b.classList.toggle('lock', locked);
  b.title = locked ? '剧情进行中，暂时无法离开' : '前往地图';
}

function playScene(id){
  const sc = SCENES[id];
  if(!sc) return;
  scene = {id, steps: sc.steps.slice(), i: 0};
  S.scenes++;
  hideAll();
  setSceneBg(sc.bg || BG_OF_SCENE[id] || (curArea && curArea.id) || 'donggong');
  $('#hud').classList.add('on');
  $('#textWrap').classList.add('on');
  if(sc.sprite) showSprite(sc.sprite);
  else if(curSprite) showSprite(curSprite);   // 立绘常驻，不在场景切换时闪掉
  step();
}

function hideAll(){
  // 离开剧情时把 CG 状态一并清掉，否则暗底会残留在地图上
  $('#stage').classList.remove('cgOn');
  $('#bgImg').classList.remove('on');
  $('#cgVeil').classList.remove('on');
  $('#map').classList.remove('on');
  $('#areaPage').classList.remove('on');
  $('#stage').classList.remove('bgMap');
  $('#stage').classList.remove('bgArea');
  $('#skipMenu').classList.remove('on');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  $('#title').classList.remove('on');
  $('#choices').classList.remove('on');
  $('#hint').classList.remove('on');
}

function hideSprite(){
  $('#sprite').classList.remove('on');
  $('#stage').classList.remove('spriteOn');
}
function showSprite(src){
  if(!src){ hideSprite(); return; }
  curSprite = src;
  $('#spriteImg').src = src;
  $('#sprite').classList.add('on');
  $('#stage').classList.add('spriteOn');
}

function syncCgShade(){
  const stage = $('#stage');
  if(!stage.classList.contains('cgOn')) return;
  const sh = $('#cgShade');
  if(!sh) return;
  let box = null;
  if($('#choices').classList.contains('on')) box = $('#choices');
  else if($('#textWrap').classList.contains('on')) box = $('#textWrap');
  const h = box ? Math.max(330, box.offsetHeight + 96) : 390;
  sh.style.height = Math.min(820, h) + 'px';
}

function setCG(src){
  $('#stage').classList.toggle('cgOn', !!src);
  syncCgShade();
  if(!src){
    $('#bgImg').classList.remove('on');
    $('#cgVeil').classList.remove('on');
    if(curSprite) showSprite(curSprite);   // CG 收起，立绘回到原来的样子
    return;
  }
  hideSprite();                            // CG 期间不叠立绘
  $('#bgImg').src = src;
  $('#bgImg').classList.add('on');
  $('#cgVeil').classList.add('on');
}

/* 主步骤调度 */
function step(){
  if(!scene) return;
  syncNav();
  const st = scene.steps[scene.i];
  if(!st){ endScene(); return; }

  if(st.k === 'block'){ renderBlock(st.paras); }
  else if(st.k === 'line'){ renderLine(st); }
  else if(st.k === 'choice'){ renderChoice(st); }
  else if(st.k === 'sprite'){ showSprite(st.img); scene.i++; step(); }
  else if(st.k === 'cg'){ setCG(st.img); scene.i++; step(); return; }
  else { scene.i++; step(); return; }
  syncSkipBtn();
  syncCgShade();
  setTimeout(syncCgShade, 140);
}

/* 档 A：整段铺开 */
function renderBlock(paras){
  $('#textWrap').classList.add('on');
  $('#who').classList.add('hide');
  $('#choices').classList.remove('on');
  const box = $('#text');
  box.className = 'paras';
  box.innerHTML = paras.map(p=>`<p>${p}</p>`).join('');
  $('#hint').classList.add('on');
  $('#hint').textContent = '点击继续';
  busy = false;
  scene.awaiting = 'block';
}

/* 档 B：逐句（打字机） */
function renderLine(st){
  $('#choices').classList.remove('on');
  $('#textWrap').classList.add('on');
  const who = $('#who');
  if(st.who){ who.textContent = st.who; who.classList.remove('hide'); }
  else who.classList.add('hide');
  const box = $('#text');
  box.className = '';
  box.textContent = '';
  $('#hint').classList.remove('on');
  busy = true;
  let i = 0;
  const txt = st.text;
  clearInterval(typing);
  typing = setInterval(()=>{
    i++;
    box.textContent = txt.slice(0, i);
    if(i >= txt.length){
      clearInterval(typing); typing = null;
      busy = false;
      $('#hint').classList.add('on');
      $('#hint').textContent = '点击继续';
    }
  }, TY_SPEED);
  scene.awaiting = 'line';
  scene.full = txt;
}

/* 选项 */
function renderChoice(st){
  setTimeout(syncCgShade, 30);
  $('#hint').classList.remove('on');
  $('#who').classList.add('hide');
  $('#textWrap').classList.remove('on');   // 选项时隐藏正文层，避免和提示语重叠
  $('#text').textContent = '';             // 立刻清空，防止残影
  const wrap = $('#choices');
  wrap.innerHTML = '';
  if(st.prompt){
    const p = document.createElement('div');
    p.className = 'prompt';
    p.textContent = st.prompt;
    wrap.appendChild(p);
  }
  st.options.forEach((op)=>{
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = op.text + (op.tag?`<span class="tag">${op.tag}</span>`:'');
    b.onclick = ()=> pickOption(op);
    wrap.appendChild(b);
  });
  wrap.classList.add('on');
  scene.awaiting = 'choice';
}

function pickOption(op){
  $('#choices').classList.remove('on');
  if(op.flag) flag(op.flag);
  applyEff(op.eff);
  // 效果提示
  const parts = [];
  for(const k in (op.eff||{})){
    if(k === '情愫') continue;
    const v = op.eff[k];
    parts.push(`${varName(k)} ${v>0?'+':''}${v}`);
  }
  if(parts.length) toast(parts.join('　'));
  // 把回复插到当前步骤后面（reply 支持 {who,text} 或纯字符串）
  const replies = (op.reply||[]).map(r=> typeof r === 'string'
    ? {k:'line', who:null, text:r}
    : {k:'line', who:r.who || null, text:r.text});
  scene.steps.splice(scene.i + 1, 0, ...replies);
  scene.i++;
  setTimeout(step, 260);
}

/* 场景结束 */
function endScene(){
  stopSkipTalk();
  const id = scene.id;
  scene = null;
  syncSkipBtn();
  const sc = SCENES[id];
  if(sc && sc.onEnd) sc.onEnd();
  $('#hint').classList.remove('on');
  $('#text').className = '';
  $('#text').textContent = '';

  if(id === 'final'){ showEnding(); return; }
  if(CHAPTER_LAST[id]){ advanceTime(); chapterEnd(); return; }

  // 主线场景结束 → 推进一个时段
  if(MAIN_NODES[S.ch].some(n=>n[2] === id)){ advanceTime(); }
  // 条件事件结束 → 不额外消耗时间（它发生在夜间行动里）
  setTimeout(()=>{
    const next = mainScene();
    if(next){ playScene(next); } else { openMap(); }
  }, 420);
}

/* ---------------- 地图 ---------------- */
function openMap(){
  stopSkipTalk();
  openSkipMenu(false);
  // 有到点的主线，先播主线（避免读档/调试/兜底路径漏掉）
  const due = mainScene();
  if(due){ playScene(due); return; }
  hideAll();
  curArea = null;
  setSceneBg(S.ch === 0 ? 'zhuque' : 'shiji');
  $('#stage').classList.add('bgMap');
  $('#hud').classList.add('on');
  $('#textWrap').classList.remove('on');
  hideSprite();
  $('#bgImg').classList.remove('on');
  $('#cgVeil').classList.remove('on');
  $('#mapTitle').textContent = (CHAPTERS[S.ch] || CHAPTERS[0]).areas === 'new' ? '越 州' : '旧 京';
  $('#mapSub').textContent = `${chapterNo()} · ${timeStr()} · ${SLOTS[S.slot]}　（每时段 1 次行动）`;

  const zones = {};
  activeAreas().forEach(x=>{ (zones[x.zone] = zones[x.zone]||[]).push(x); });
  const wrap = $('#areas');
  wrap.innerHTML = '';
  for(const zone in zones){
    const box = document.createElement('div');
    box.className = 'area';
    box.innerHTML = `<h3>${zone}</h3><div class="spots"></div>`;
    const spots = box.querySelector('.spots');
    zones[zone].forEach(x=>{
      const evs = EVENTS.filter(e=>e.area===x.id && evAvail(e));
      const can = x.opts.filter(o=>!o.slots || o.slots.includes(S.slot)).map(o=>o.nm);
      const isStory = evs.some(e=>e.sub);
      const dot = evs.length ? `<span class="${isStory? 'dotEv':'dotSrc'}"></span>` : '';
      const goCls = evs.length ? (isStory? 'src' : 'ev') : '';
      const goTxt = evs.length
        ? (isStory && !evs.some(e=>!e.sub) ? '此处有旧事未了' : '此刻似有动静')
        : (can.length? can.join(' · ') : '此刻无可做');
      const b = document.createElement('button');
      b.className = 'spot';
      b.innerHTML = `<div class="n">${dot}${x.nm}</div>
        <div class="a">${x.sub}</div>
        <div class="go ${goCls}">${goTxt}</div>`;
      b.onclick = (e)=>{ e.stopPropagation(); openArea(x.id); };
      spots.appendChild(b);
    });
    wrap.appendChild(box);
  }
  $('#mapFoot').innerHTML =

/* ---------------- 区域页 ---------------- */
const VAR_LABEL = { 好感沈昭:'沈昭好感', 亲情元宁:'元宁亲情', 情愫:'情愫' };
function varName(k){ return VAR_LABEL[k] || k; }

function capLeftOf(eff){
  let left = CHAPTER_CAP;
  for(const k in (eff||{})){
    if(k === '情愫') continue;
    left = Math.min(left, CHAPTER_CAP - (S.gain[k]||0));
  }
  return Math.max(0, left);
}

function openArea(id){
  if(scene){ toast('剧情还没走完，先把它听完'); return; }
  const a = activeAreas().find(x=>x.id===id);
  if(!a) return;
  curArea = a;
  hideAll();
  setSceneBg(a.id);
  $('#stage').classList.add('bgArea');
  $('#hud').classList.add('on');
  hideSprite();
  $('#aName').textContent = a.nm;
  $('#aSub').textContent = `${a.zone.replace(/ /g,'')} · ${a.sub}`;
  $('#aLine').textContent = a.line;

  const evs = EVENTS.filter(e=>e.area===a.id && evAvail(e));
  const wrap = $('#aOpts');
  wrap.innerHTML = '';

  evs.forEach(e=>{
    const b = document.createElement('button');
    b.className = 'opt ' + (e.sub ? 'ev-story' : 'ev');
    b.innerHTML = `<div class="l">
        <div class="n"><span class="flag">${e.sub ? '支线' : '事件'}</span>${e.nm}${e.sub? `<span style="font-size:11px;color:#7C7264;letter-spacing:.12em;margin-left:8px">${e.sub}</span>`:''}</div>
        <div class="d">${e.hook}</div></div>
      <div class="r">有决断<span class="g">会占掉这个时段</span></div>`;
    b.onclick = (ev2)=>{ ev2.stopPropagation(); playEvent(e); };
    wrap.appendChild(b);
  });

  a.opts.forEach(o=>{
    const open = !o.slots || o.slots.includes(S.slot);
    const b = document.createElement('button');
    b.className = 'opt' + (open? '' : ' off');
    const effStr = Object.entries(o.eff||{}).map(([k,v])=>`${varName(k)} ${v>0?'+':''}${v}`).join('　');
    const left = capLeftOf(o.eff);
    b.innerHTML = `<div class="l"><div class="n">${o.nm}</div><div class="d">${o.d}</div></div>
      <div class="r">${open? effStr : '此刻不在此处'}<span class="g">${
        open ? (left? `本章还可 +${left}` : '本章已到顶') : o.slots.map(x=>SLOTS[x]).join(' / ') + ' 才有'}</span></div>`;
    b.onclick = (ev2)=>{
      ev2.stopPropagation();
      if(open) doOption(a,o);
      else toast(`${o.slots.map(x=>SLOTS[x]).join(' / ')}才做得成。`);
    };
    wrap.appendChild(b);
  });

  const remains = EVENTS.some(e=>e.area===a.id && !has('ev_'+e.id));
  $('#aFoot').innerHTML =
    `<span>学识<b>${S.vars.学识}</b></span><span>武略<b>${S.vars.武略}</b></span>` +
    `<span>仁德<b>${S.vars.仁德}</b></span><span>帝威<b>${S.vars.帝威}</b></span>` +
    `<span style="margin-left:auto">${remains? '此地近日似乎还有别的事' : ''}</span>`;
  $('#areaPage').classList.add('on');
  syncNav();
}

/* 行动：数值 → 推进时段 → 一小场戏（含对话与选项） */
function doOption(a, op){
  if(scene){ toast('剧情还没走完，先把它听完'); return; }
  const steps = (op.steps && op.steps.length)
    ? op.steps.slice()
    : [{k:'block', paras: op.text || ['……']}];
  applyEff(op.eff);
  advanceTime();
  hideAll();
  $('#hud').classList.add('on');
  $('#textWrap').classList.add('on');
  if(op.who && HALF[op.who]) showSprite(HALF[op.who]);
  scene = {id:'op_'+(op.id||'x'), steps, i:0};
  step();
}

/* 事件是否在窗口内（旬内日 + 时段 + 条件） */
function evAvail(ev){
  if(ev.once && has('ev_'+ev.id)) return false;
  if(ev.ch !== undefined){
    const arr = Array.isArray(ev.ch) ? ev.ch : [ev.ch];
    if(!arr.includes(S.ch)) return false;
  }
  const inDay = ((S.day - 1) % 10) + 1;
  if(ev.dayMod && !ev.dayMod.includes(inDay)) return false;
  if(ev.dayMin && S.day < ev.dayMin) return false;
  if(ev.dayMax && S.day > ev.dayMax) return false;
  if(ev.slots && !ev.slots.includes(S.slot)) return false;
  if(ev.need){ for(const k in ev.need){ if((S.vars[k]||0) < ev.need[k]) return false; } }
  return true;
}

function playEvent(ev){
  flag('ev_'+ev.id);
  advanceTime();          // 事件同样占掉这个时段
  let steps;
  if(ev.steps && ev.steps.length){
    steps = ev.steps.slice();
  } else {
    steps = [{k:'block', paras:ev.text}];
    if(ev.choice) steps.push({k:'choice', prompt:ev.choice.prompt, options:ev.choice.options});
  }
  scene = {id:'ev_'+ev.id, steps, i:0};
  hideAll();
  setSceneBg(ev.bg || ev.area || 'donggong');
  $('#hud').classList.add('on');
  $('#textWrap').classList.add('on');
  if(ev.who && HALF[ev.who]) showSprite(HALF[ev.who]);
  step();
}


/* ---------------- 跳过 ---------------- */
let skipping = false, skipTimer = null;

function stopSkipTalk(){
  skipping = false;
  clearInterval(skipTimer); skipTimer = null;
  const b = $('#btnTalkSkip');
  if(b){ b.classList.remove('act'); b.textContent = '跳过对话'; }
}

function syncSkipBtn(){
  const b = $('#btnTalkSkip');
  if(!b) return;
  const on = !!scene && scene.awaiting !== 'choice';
  b.classList.toggle('on', on);
  if(!on) stopSkipTalk();
}

function toggleSkipTalk(){
  if(!scene){ toast('现在没有对话可跳'); return; }
  if(skipping){ stopSkipTalk(); return; }
  skipping = true;
  const b = $('#btnTalkSkip');
  b.classList.add('act');
  b.textContent = '停止跳过';
  skipTimer = setInterval(()=>{
    if(!scene || $('#choices').classList.contains('on') || scene.awaiting === 'choice'){
      stopSkipTalk(); return;
    }
    if(busy){                     // 正在打字 → 立刻铺满
      clearInterval(typing); typing = null;
      $('#text').textContent = scene.full;
      busy = false;
      $('#hint').classList.add('on');
      return;
    }
    onClickStage();
  }, 90);
}

function openSkipMenu(force){
  if(scene){ toast('剧情进行中，先把这一段听完'); return; }
  const m = $('#skipMenu');
  const want = (force === undefined) ? !m.classList.contains('on') : force;
  m.classList.toggle('on', want);
}

/* 跳 n 个时段（1 天 = 3 个时段）；中途撞到主线就停下并播放 */
function jumpSlots(n){
  closePanel(); openSkipMenu(false);
  let moved = 0;
  while(moved < n){
    if(mainScene()) break;
    if(S.day === TOTAL_DAYS && S.slot === 2) break;
    advanceTime(); moved++;
  }
  openMap();                       // openMap 会先补主线
  if(moved > 0 && !scene) toast(`跳过了 ${Math.ceil(moved/3)} 天`);
}

/* 一路推到下一个主线节点前，再交给 openMap 触发 */
function jumpToMain(){
  closePanel(); openSkipMenu(false);
  let guard = 0;
  while(guard++ < 400){
    if(mainScene()) break;
    if(S.day === TOTAL_DAYS && S.slot === 2) break;
    advanceTime();
  }
  if(!mainScene()) toast('后面没有主线了');
  openMap();
}

const STAGE_SHEN = [[0,'戒备'],[20,'受教'],[40,'信赖'],[60,'亲近'],[80,'难舍']];
const STAGE_NING = [[0,'生疏'],[20,'亲近'],[40,'依恋'],[60,'知心'],[80,'骨肉']];
function stageOf(v, list){
  let s = list[0][1];
  list.forEach(([n,t])=>{ if(v>=n) s = t; });
  return s;
}
function nextOf(v, list){
  for(const [n,t] of list){ if(v < n) return {t, need: n - v}; }
  return null;
}

function statLine(name, val, max, gain){

}

const SAVE_KEY = 'dg_save_';
function openSave(){
  const wrap = $('#saveList');
  const inScene = !!scene;   // 剧情进行中不许读档，防止跳过主线
  wrap.innerHTML = '';
  for(let i=1;i<=3;i++){
    const raw = localStorage.getItem(SAVE_KEY+i);
    let info = '空';
    if(raw){
      try{ const d = JSON.parse(raw); info = `${d.dateStr} · ${SLOTS[d.slot]}`; }catch(e){}
    }
    const card = document.createElement('div');
    card.className = 'saveCard';
    card.innerHTML = `<div class="t">存档 ${i}</div><div class="d">${info}</div>
      <div class="r"><button class="btn" data-save="${i}">保存</button>
      <button class="btn" data-load="${i}" ${raw && !inScene ? '' : 'disabled'}>读取</button></div>`;
    wrap.appendChild(card);
  }
  $('#saveNote').textContent = inScene ? '剧情进行中：可以保存，但不能读取——免得把主线跳过去。' : '';
  wrap.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{
    const snap = JSON.parse(JSON.stringify(S));
    snap.dateStr = timeStr();
    localStorage.setItem(SAVE_KEY + b.dataset.save, JSON.stringify(snap));
    toast('已保存到存档 ' + b.dataset.save);
    openSave();
  });
  wrap.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{
    const raw = localStorage.getItem(SAVE_KEY + b.dataset.load);
    if(!raw) return;
    if(!confirm('读取会覆盖当前进度，继续？')) return;
    S = JSON.parse(raw);
    refreshHud();
    toast('已读取存档 ' + b.dataset.load);
    openMap();
  });
  openPanel('panelSave');
}

function judgeEnding(){
  const v = S.vars, n = S.nat;
  let route = S.flags.route;
  if(!route) route = ((v.好感谢无咎||0) > v.好感沈昭) ? 'xie' : 'shen';
  if(n.军队 <= 0 || n.民心 < 15) return 'wangguo';
  if(route === 'shen' && v.好感沈昭 >= 82 && v.情愫 >= 8 && v.帝威 >= 70) return 'bingzuo';
  if(route === 'shen' && (v.好感沈昭 >= 60 || v.情愫 >= 4)) return 'xunguo';
  if(route === 'xie' && (v.好感谢无咎||0) >= 70 && (v.复仇心||0) <= 3) return 'shengsi';
  if(route === 'xie' && (v.复仇心||0) >= 5) return 'dao';
  if(v.帝威 >= 60 && n.民心 >= 40 && v.好感沈昭 < 60 && v.情愫 < 4) return 'mingjun';
  return 'kuilei';
}

function showEnding(){
  hideAll();
  $('#hud').classList.remove('on');
  const v = S.vars, key = judgeEnding(), e = ENDINGS[key];
  $('#endKick').textContent = '元 熙 元 年 · 终';
  $('#endTitle').textContent = e.t;
  $('#endText').innerHTML = e.l.join('<br>');
  $('#endStats').innerHTML = [
    ['学识', v.学识], ['武略', v.武略], ['仁德', v.仁德], ['帝威', v.帝威],
    ['民心', S.nat.民心], ['沈昭好感', v.好感沈昭], ['元宁亲情', v.亲情元宁], ['谢无咎好感', v.好感谢无咎||0]
  ].map(([k,n])=>`<div>${k}<b>${n}</b></div>`).join('');
  $('#ending').classList.add('on');
}

function normalizeSave(x){
  const d = newState();
  if(typeof x.ch !== 'number') x.ch = 0;
  x.vars = x.vars || {};
  x.gain = x.gain || {};
  for(const k in d.vars) if(!(k in x.vars)) x.vars[k] = d.vars[k];
  for(const k in d.gain) if(!(k in x.gain)) x.gain[k] = 0;
  if(!x.nat) x.nat = d.nat;
  if(!x.flags) x.flags = {};
  return x;
}

/* ---------------- 工具 ---------------- */
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('on'), 1900);
}

/* 点击推进 */
function onClickStage(e){
  if(document.querySelector('.panel.on')) return;   // 面板覆盖时，点空白不推进剧情
  if(!scene) return;
  if($('#choices').classList.contains('on')) return;
  if(scene.awaiting === 'choice') return;

  if(busy && scene.awaiting === 'line'){
    // 正在打字 → 立刻显示全文
    clearInterval(typing); typing = null;
    $('#text').textContent = scene.full;
    busy = false;
    $('#hint').classList.add('on');
    return;
  }
  scene.i++;
  step();
}

/* 键盘 */
document.addEventListener('keydown', e=>{
  const titleOn = $('#title').classList.contains('on');
  // 标题页：回车 / 空格 开始
  if(titleOn && (e.code === 'Space' || e.code === 'Enter')){
    e.preventDefault();
    $('#title').classList.remove('on');
    startNew();
    return;
  }
  // Esc：先关面板，再回地图
  if(e.code === 'Escape'){
    e.preventDefault();
    if(closePanel()) return;
    if(!scene && !$('#map').classList.contains('on')) openMap();
    return;
  }
  if(titleOn) return;
  if(document.querySelector('.panel.on')) return;   // 面板打开时空格不推进剧情
  if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); onClickStage(); }
});

/* ---------------- 启动 ---------------- */
function startNew(){
  S = newState();
  refreshHud();
  playScene('p01');
}

function continueGame(){
  for(let i=1;i<=3;i++){
    const raw = localStorage.getItem(SAVE_KEY+i);
    if(raw){
      try{ S = normalizeSave(JSON.parse(raw)); refreshHud(); openMap(); toast('已读取存档 '+i); return; }catch(e){}
    }
  }
  toast('没有找到存档');
}

$('#stage').addEventListener('click', onClickStage);
document.querySelectorAll('.panel [data-close]').forEach(b=>{

});
$('#aBack').onclick = (e)=>{ e.stopPropagation(); openMap(); };
$('#btnTalkSkip').onclick = (e)=>{ e.stopPropagation(); toggleSkipTalk(); };
$('#btnSkipDay').onclick = (e)=>{ e.stopPropagation(); openSkipMenu(); };
document.querySelectorAll('#skipMenu [data-day]').forEach(b=>{
  b.onclick = (e)=>{ e.stopPropagation(); jumpSlots(parseInt(b.dataset.day,10) * 3); };
});
$('#skToMain').onclick = (e)=>{ e.stopPropagation(); jumpToMain(); };
document.addEventListener('click', (e)=>{
  if(e.target.closest('#skipMenu') || e.target.closest('#btnSkipDay')) return;
  openSkipMenu(false);
});
$('#btnMap').onclick = (e)=>{
  e.stopPropagation();
  if(closePanel()) return;
  if(scene){ toast('剧情还没走完，先把它听完'); return; }
  openMap();
};
$('#btnChar').onclick = (e)=>{
  e.stopPropagation();
  if($('#panelChar').classList.contains('on')) closePanel(); else openChar();
};
$('#btnState').onclick = (e)=>{
  e.stopPropagation();
  if($('#panelState').classList.contains('on')) closePanel(); else openState();
};
$('#btnSave').onclick = (e)=>{
  e.stopPropagation();
  if($('#panelSave').classList.contains('on')) closePanel(); else openSave();
};
$('#ccGo').onclick = (e)=>{
  e.stopPropagation();
  $('#chapterCard').classList.remove('on');
  openMap();
  const nodes = MAIN_NODES[S.ch] || [];
  if(nodes.length && nodes[0][0] > 1){
    const d = nodes[0][0] - 1;
    setTimeout(()=> toast(`距下一次朝议还有 ${d} 天`), 500);
  }

$('#btnStart').onclick = (e)=>{ e.stopPropagation(); $('#title').classList.remove('on'); startNew(); };
$('#btnContinue').onclick = (e)=>{ e.stopPropagation(); $('#title').classList.remove('on'); continueGame(); };
$('#btnAgain').onclick = ()=> location.reload();
$('#btnBackTitle').onclick = ()=> location.reload();

$('#btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `帝王与国相-存档-${DAY_NAMES[S.day-1]}日.json`;
  a.click();
  toast('存档文件已导出');
};
$('#btnImport').onclick = ()=>{
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{ S = normalizeSave(JSON.parse(reader.result)); refreshHud(); openMap(); toast('存档已导入'); }
      catch(e){ toast('这个文件读不了'); }
    };
    reader.readAsText(f);
  };
  inp.click();
};
$('#btnRestart').onclick = ()=>{ if(confirm('重开序章？当前进度会丢。')) location.reload(); };
$('#btnSkip').onclick = ()=>{
  S.day = TOTAL_DAYS; S.slot = 1;
  ['p01','p02','p03','p04','p05','p06'].forEach(k=>{ S.flags[k] = true; });
  refreshHud(); openMap(); toast('已跳到最后一夜之前');
};

/* 缩放适配 */
/* 桌面：整体等比缩放；手机/窄屏：流式铺满（见 @media 段） */
function isNarrow(){
  return window.innerWidth <= 900 || window.innerHeight <= 560;
}
function fit(){
  const st = $('#stage');
  if(isNarrow()){
    st.classList.add('mobile');
    st.style.transform = 'none';
    st.style.width = '100%';
    st.style.height = '100%';
  } else {
    st.classList.remove('mobile');
    st.style.width = '1280px';
    st.style.height = '720px';
    const s = Math.min(window.innerWidth/1280, window.innerHeight/720);
    st.style.transform = `scale(${s})`;
  }
}
window.addEventListener('resize', ()=>{ fit(); setTimeout(syncCgShade, 60); });
window.addEventListener('orientationchange', ()=> setTimeout(fit, 120));
fit();
refreshHud();

/* 标题 */
$('#title').classList.add('on');

/* 调试入口
   ?start=1 从序章开场  ?map=1 直接进地图  ?area=donggong 直接进区域
   ?char=1 ?state=1 ?save=1 直接开面板
   附加：&day=3&slot=2&d=20 指定日期/时段/好感；&notrans=1 关动画；&fast=1 打字机最快
        &smoke=1 小段自走  &smoke=full 全流程自走（跑完 25 天看结果） */
(function(){
  const q = new URLSearchParams(location.search);
  /* 场景底预览：?bg=all 一次看全；?bg=donggong 单看 */
  if(q.has('bg')){
    const list = Object.keys(SB).filter(k => k !== 'courtOld');
    if(q.get('bg') === 'all'){
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;inset:0;background:#17140f;overflow:auto;z-index:9999;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;';
      list.forEach(k=>{
        const cell = document.createElement('div');
        cell.style.cssText = 'position:relative;aspect-ratio:16/9;background:#F2EADB;overflow:hidden;';
        cell.innerHTML = SB[k]();
        const svg = cell.querySelector('svg');
        svg.style.cssText = 'width:100%;height:100%;display:block;';
        const tag = document.createElement('div');
        tag.textContent = k;
        tag.style.cssText = 'position:absolute;left:6px;bottom:5px;font-size:11px;color:#3a2f22;background:rgba(255,255,255,.78);padding:1px 7px;border-radius:2px;letter-spacing:.04em;';
        cell.appendChild(tag);
        wrap.appendChild(cell);
      });
      document.body.appendChild(wrap);
    } else {
      document.querySelector('.paper').style.opacity = '.35';
      $('#title').classList.remove('on');
      setSceneBg(q.get('bg'), true);
    }
    return;
  }

  if(q.has('notrans')) document.head.insertAdjacentHTML('beforeend','<style>*{transition:none!important;animation:none!important}</style>');
  if(q.get('fast')) TY_SPEED = 1;

  if(q.has('ui')){
    setTimeout(()=>{
      const log=[];
      const need=[['#btnMap','地图'],['#btnChar','人物'],['#btnState','状态'],['#btnSave','存档'],
                  ['#btnSkipDay','跳过'],['#aBack','区域返回'],['#btnTalkSkip','跳过对话'],
                  ['#ccGo','换章开始'],['#btnStart','标题开始'],['#btnTalk','开始游戏']];
      need.forEach(([sel,nm])=>{
        const e=document.querySelector(sel);
        log.push(`${nm} ${sel}: ` + (e? (typeof e.onclick==='function'?'绑定✓':'存在但无onclick') : '不存在'));
      });
      ['#skipMenu [data-day="1"]','#skipMenu [data-day="3"]','#skipMenu [data-day="5"]','#skToMain'].forEach(sel=>{
        const e=document.querySelector(sel);
        log.push(`跳天 ${sel}: ` + (e? (typeof e.onclick==='function'?'绑定✓':'存在但无onclick') : '不存在'));
      });
      // 面板关闭按钮
      const closes=document.querySelectorAll('[data-close]');
      log.push('面板返回按钮数量: '+closes.length+' / 全部绑定: '+Array.from(closes).every(e=>typeof e.onclick==='function'));
      // 存档三槽
      const sv=document.querySelectorAll('[data-save]').length, ld=document.querySelectorAll('[data-load]').length;
      log.push('存档按钮 '+sv+' 个 / 读取按钮 '+ld+' 个');
      // 选项容器
      log.push('选项容器 #choices: '+(document.querySelector('#choices')?'✓':'✗'));
      // 关键函数
      ['openMap','openArea','openChar','openState','openSave','closePanel','jumpSlots','jumpToMain',
       'toggleSkipTalk','playScene','endScene','chapterEnd','showEnding','setSceneBg'].forEach(f=>{
        log.push('函数 '+f+': '+(typeof window[f]==='function'?'✓':'✗'));
      });
      const d=document.createElement('pre'); d.id='ui';
      d.textContent = log.join('\n');
      document.body.appendChild(d);
    }, 500);
  }
  if(q.has('clicks')){
    const n = parseInt(q.get('clicks'),10)||0;
    let k = 0;
    const t = setInterval(()=>{
      k++;
      if(k > n){ clearInterval(t); return; }
      if($('#choices').classList.contains('on')){
        if(q.has('stopchoice')){ clearInterval(t); return; }
        $('#choices .choice').click();
      }
      else $('#stage').click();
    }, 130);
  }
  if(q.has('hud')){
    setTimeout(()=>{
      const h=$('#hud'), r=h.getBoundingClientRect();
      const out=['hud w='+Math.round(r.width)+' h='+Math.round(r.height)+' scrollW='+h.scrollWidth];
      Array.from(h.children).forEach(c=>{
        const b=c.getBoundingClientRect();
        if(c.tagName==='BUTTON') out.push('  btn '+c.textContent.trim()+' x='+Math.round(b.x)+' y='+Math.round(b.y)+' w='+Math.round(b.width));
        else if(c.id) out.push('  '+c.id+' w='+Math.round(b.width));
      });
      const d=document.createElement('pre'); d.id='hudinfo';
      d.textContent=out.join('\n');
      document.body.appendChild(d);
    }, 500);
  }
  if(q.has('slots')){
    setTimeout(()=>{
      const out=[];
      [['旧京',AREAS],['越州',AREAS_NEW]].forEach(([nm,arr])=>{
        arr.forEach(a=>{
          const c=[0,1,2].map(sl=>a.opts.filter(o=>!o.slots||o.slots.includes(sl)).length);
          out.push(`${nm} ${a.id} ${a.nm} 晨:${c[0]} 午:${c[1]} 夜:${c[2]}` + (c.includes(0)?'  ← 空档':''));
        });
      });
      const d=document.createElement('pre'); d.id='slots';
      const gaps=out.filter(x=>x.includes('←'));
      d.textContent = 'gaps='+gaps.length+'\n'+gaps.join('\n');
      document.body.appendChild(d);
    }, 400);
  }
  if(q.has('probe')){
    setTimeout(()=>{
      const d=document.createElement('pre'); d.id='probe';
      const m=$('#map'), st=$('#stage');
      d.textContent = JSON.stringify({
        iw:innerWidth, ih:innerHeight,
        stage:st.offsetWidth+'x'+st.offsetHeight,
        map:[m.offsetWidth,m.scrollWidth],
        areas:$('#areas').offsetWidth,
        zone0:$('.area')?$('.area').offsetWidth:0,
        spot:$('.spot')?$('.spot').offsetWidth:0,
        hud:$('#hud').scrollWidth+'/'+$('#hud').offsetWidth,
        cls:st.className
      });
      document.body.appendChild(d);
    }, 600);
  }

  /* 自走：选项 → 正文 → 分支；full 模式会一直跑到底 */
  if(q.get('smoke')){
    const full = q.get('smoke') === 'full';
    const cap = full ? 42000 : 34;
    let n = 0; const log = [];
    window.addEventListener('error', e=>log.push('ERR:'+e.message));
    const t = setInterval(()=>{
      n++;
      if($('#ending').classList.contains('on') || n > cap){
        clearInterval(t);
        const d = document.createElement('pre'); d.id='smoke';
        d.textContent = 'END='+$('#ending').classList.contains('on')
          +' day='+S.day+' slot='+S.slot+' scenes='+S.scenes
          +' flags='+Object.keys(S.flags).sort().join(',')
          +' ch='+S.ch+' cc='+$('#chapterCard').classList.contains('on')
          +' ticks='+n+' errs='+log.filter(x=>x.startsWith('ERR')).length
          +' map='+$('#map').classList.contains('on')
          +' scene='+(scene?scene.id:'-')
          +' '+log.filter(x=>x.startsWith('ERR')).join('|');
        document.body.appendChild(d);
        return;
      }
      if($('#chapterCard').classList.contains('on')){ $('#ccGo').click(); return; }
      const c = document.querySelector('#choices.on .choice');
      const opt = document.querySelector('#areaPage.on .opt:not(.off)');
      const spot = document.querySelector('#areas .spot');
      if(c) c.click();
      else if(!scene && opt) opt.click();
      else if(!scene && $('#map').classList.contains('on') && spot) spot.click();
      else $('#stage').click();
    }, full ? 22 : 260);
  }

  /* 事件可达性自检：每个事件至少存在一个可触发的时间点 */
  if(q.has('evcheck')){
    const seen = {}; const saved = JSON.stringify(S);
    for(let c=0;c<CHAPTERS.length;c++){
      for(let d=1; d<=TOTAL_DAYS; d++){
        for(let sl=0; sl<3; sl++){
          S.ch=c; S.day=d; S.slot=sl;
          for(const k in S.vars) S.vars[k] = 100;
          for(const e of EVENTS){ if(evAvail(e)) seen[e.id]=(seen[e.id]||0)+1; }
        }
      }
    }
    const miss = EVENTS.filter(e=>!seen[e.id]).map(e=>e.id);
    const d=document.createElement('pre'); d.id='evcheck';
    d.textContent = 'total='+EVENTS.length+' reachable='+Object.keys(seen).length+' missing='+miss.join(',');
    document.body.appendChild(d);
  }

  /* 全主线自检：把每一章的每个节点都播一遍，自动点到底 */
  if(q.has('allnodes')){
    const list = [];
    MAIN_NODES.forEach((arr,ci)=>arr.forEach(([d,sl,id])=>list.push({ci,d,sl,id})));
    let k = 0; const errs = [];
    window.addEventListener('error', e=>errs.push(list[k] ? list[k].id+' '+e.message : e.message));
    const next = ()=>{
      if(k >= list.length){
        const d=document.createElement('pre'); d.id='allnodes';
        d.textContent = 'ran='+list.length+' errs='+errs.length+' '+errs.slice(0,6).join(' | ');
        document.body.appendChild(d); return;
      }
      const it = list[k];
      S.ch = it.ci; S.day = it.d; S.slot = it.sl;
      $('#chapterCard').classList.remove('on');
      try{ playScene(it.id); }catch(e){ errs.push(it.id+' '+e.message); }
      let clicks = 0;
      const t = setInterval(()=>{
        clicks++;
        if($('#chapterCard').classList.contains('on')) $('#ccGo').click();
        const c = document.querySelector('#choices.on .choice');
        if(c) c.click(); else $('#stage').click();
        if(clicks > 30){ clearInterval(t); k++; setTimeout(next, 40); }
      }, 10);
    };
    next();
  }

  if(!q.has('start') && !q.has('map') && !q.has('char') && !q.has('state') && !q.has('save') && !q.has('area')) return;
  $('#title').classList.remove('on');
  if(q.has('start') && !q.has('map') && !q.has('area')){ startNew(); return; }

  S = newState();
  if(q.has('ch')) S.ch = Math.max(0, Math.min(CHAPTERS.length-1, parseInt(q.get('ch'),10)||0));
  if(q.has('day')) S.day = Math.max(1, Math.min(TOTAL_DAYS, parseInt(q.get('day'),10)||1));
  if(q.has('slot')) S.slot = Math.max(0, Math.min(2, parseInt(q.get('slot'),10)||0));
  const d = parseInt(q.get('d')||'0', 10);
  if(d){
    S.vars.好感沈昭 = d; S.vars.亲情元宁 = Math.round(d*0.55);
    S.vars.学识 = 42; S.vars.武略 = 18; S.vars.帝威 = 61;
    S.gain.好感沈昭 = 8; S.gain.学识 = 6;
  }
  refreshHud();
  openMap();
  if(q.has('area')) openArea(q.get('area'));
  if(q.has('menu')) setTimeout(()=>openSkipMenu(true), 300);
  if(q.has('jump')) setTimeout(()=>jumpSlots((parseInt(q.get('jump'),10)||1)*3), 300);
  if(q.has('auto')) setTimeout(()=>{ const b = q.get('auto')==='ev' ? $('#aOpts .opt.ev, #aOpts .opt.ev-story') : $('#aOpts .opt:not(.off):not(.ev):not(.ev-story)'); if(b) b.click(); }, 300);
  if(q.has('char')) openChar();
  else if(q.has('save')) openSave();
  else if(q.has('state')) openState();
})();
</script>
